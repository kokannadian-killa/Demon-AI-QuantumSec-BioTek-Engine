# mkarchiso empties /boot inside airootfs.sfs (the kernel lives on the ISO), so
# copy the kernel + microcode from the boot medium into the new system.
---
dontChroot: true
timeout: 300
script:
    - "mkdir -p ${ROOT}/boot"
    - "cp -f /run/archiso/bootmnt/demonos/boot/x86_64/vmlinuz-linux-garuda ${ROOT}/boot/vmlinuz-linux-garuda"
    - "-cp -f /run/archiso/bootmnt/demonos/boot/intel-ucode.img /run/archiso/bootmnt/demonos/boot/amd-ucode.img ${ROOT}/boot/"
    - "test -s ${ROOT}/boot/vmlinuz-linux-garuda"
