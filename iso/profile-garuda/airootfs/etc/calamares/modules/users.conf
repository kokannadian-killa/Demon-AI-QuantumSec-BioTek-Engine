---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - name: wheel
      must_exist: false
      system: true
    - audio
    - input
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
sudoersConfigureWithGroup: false
setRootPassword: true
doReusePassword: true
passwordRequirements:
    nonempty: true
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
    shell: /usr/bin/fish
    forbidden_names: [ root, demon ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "demonos-${cpu}"
    forbidden_names: [ localhost ]
