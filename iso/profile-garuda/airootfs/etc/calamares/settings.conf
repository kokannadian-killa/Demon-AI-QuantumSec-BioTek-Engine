# DemonOS PhantomCore installer (Calamares, Garuda's calamares-garuda build) for
# the archiso live medium: the live root (airootfs.sfs) is copied to the target,
# the live-only bits are undone (demonos-installer-post), then mkinitcpio + GRUB.
# Nothing here runs until the user clicks Install on the summary page.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:       copykernel
  module:   shellprocess
  config:   shellprocess-copykernel.conf
- id:       post
  module:   shellprocess
  config:   shellprocess-post.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - shellprocess@copykernel
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - removeuser
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@post
  - initcpio
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: demonos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
